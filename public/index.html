<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScoreMe — вход</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var t = localStorage.getItem('scoreme-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <span class="brand"><i class="ti ti-player-track-next" aria-hidden="true"></i> ScoreMe</span>
    <button class="icon-btn" id="themeToggle" aria-label="Сменить тему"></button>
  </header>

  <main class="auth-wrap">
    <div class="auth-card" id="authCard" data-mode="login">

      <!-- Переключатель режима. Намеренно ВНЕ анимируемой области (.auth-stage),
           чтобы по нему можно было кликать даже во время блика. -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab is-active" id="tabLogin" role="tab" aria-selected="true">Войти</button>
        <button class="auth-tab" id="tabRegister" role="tab" aria-selected="false">Регистрация</button>
      </div>

      <!-- Сцена: внутри неё ходит блик и подменяются поля. -->
      <div class="auth-stage">
        <form class="auth-form" id="authForm" novalidate>
          <h1 class="auth-title" id="authTitle">С возвращением</h1>

          <!-- Поля только для регистрации. В режиме входа скрыты через CSS. -->
          <div class="field reg-only">
            <label for="firstName">Имя</label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name">
          </div>
          <div class="field reg-only">
            <label for="lastName">Фамилия</label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name">
          </div>

          <!-- Общие поля: есть и при входе, и при регистрации. -->
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>

          <div class="field reg-only">
            <label for="confirmPassword">Повторите пароль</label>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Войти</button>
          <div class="auth-error" id="authError" role="alert" aria-live="polite"></div>
        </form>

        <!-- Блик-полоса. aria-hidden — экранным читалкам она не нужна. -->
        <div class="sweep" id="sweep" aria-hidden="true"></div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
